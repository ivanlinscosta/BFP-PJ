name: Deploy

on:
  push:
    branches:
      - homol
      - prod

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run typecheck && npm run lint && npm run test

      - name: Configure AWS credentials (GitHub OIDC, no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'sa-east-1' }}

      - name: Build and deploy (bfp-pj-${{ github.ref_name }})
        run: |
          npm run build -w api
          npm run build -w web
          npm run deploy -w infra -- -c env=${{ github.ref_name }} -c bedrockModelId=${{ vars.BEDROCK_MODEL_ID }}
